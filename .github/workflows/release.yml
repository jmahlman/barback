# Cutting a release.
#
#   npm version minor          # bumps package.json and makes a v* tag
#   git push --follow-tags
#
# That tag is the whole trigger. Each architecture is built on a runner of
# its own architecture, then the two are stitched into one multi-arch image
# and a GitHub Release is published. Those release notes are what the app
# shows under Settings → Releases.
#
# Native runners rather than QEMU on purpose: emulating arm64 truncates the
# pipe Prisma reads its schema back over, and `prisma generate` dies with
# "Unable to parse JSON ... [Context: getDmmf]". Native runners are also
# several times faster.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.2.0"
        required: true

permissions:
  contents: write # create the release
  packages: write # push to GHCR

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check the tag matches package.json
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "${TAG#v}" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG."
            echo "Run 'npm version' rather than tagging by hand." >&2
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only; the merge job below applies the real tags.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Record the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${{ steps.build.outputs.digest }}"

      - name: Hand the digest to the merge job
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # The changelog looks back at the previous tag.
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Collect the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.tag, '-') }}

      - name: Stitch the architectures into one image
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Check the published image
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.version.outputs.version }}

      - name: Assemble the release notes
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PREVIOUS=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)

          {
            if [ -n "$PREVIOUS" ]; then
              echo "### What changed"
              echo
              git log --no-merges --pretty='- %s' "$PREVIOUS..$TAG"
              echo
              echo "**Full diff:** https://github.com/${{ github.repository }}/compare/$PREVIOUS...$TAG"
            else
              echo "### First release"
              echo
              echo "Barback $TAG. See the README for what it does and how to run it."
            fi

            echo
            echo "### Running it"
            echo
            echo '```bash'
            echo "docker pull ${{ env.IMAGE }}:${{ steps.version.outputs.version }}"
            echo '```'
            echo
            echo "Built for \`linux/amd64\` and \`linux/arm64\`."
          } > release-notes.md

          cat release-notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
