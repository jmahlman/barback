# Cutting a release.
#
#   npm version minor          # bumps package.json and makes a v* tag
#   git push --follow-tags
#
# That tag is the whole trigger. This workflow then builds the image for
# amd64 and arm64, publishes it to GHCR, and opens a GitHub Release whose
# notes become the changelog shown inside the app under Settings → Releases.
name: Release

on:
  push:
    tags:
      - "v*"
  # Allows a re-run from the Actions tab without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.2.0"
        required: true

permissions:
  contents: write # create the release
  packages: write # push to GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # Needed so the changelog can look back at previous tags.
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${{ steps.version.outputs.version }}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG."
            echo "Run 'npm version' rather than tagging by hand." >&2
            exit 1
          fi
          echo "package.json and the tag agree on $PKG."

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Lowercase, because GHCR rejects capitals in image names.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.tag, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assemble the release notes
        id: notes
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PREVIOUS=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)

          {
            if [ -n "$PREVIOUS" ]; then
              echo "### What changed"
              echo
              git log --no-merges --pretty='- %s' "$PREVIOUS..$TAG"
              echo
              echo "**Full diff:** https://github.com/${{ github.repository }}/compare/$PREVIOUS...$TAG"
            else
              echo "### First release"
              echo
              echo "Barback $TAG."
            fi

            echo
            echo "### Running it"
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${{ github.repository }}:${TAG#v}"
            echo '```'
          } > release-notes.md

          echo "Generated notes:"
          cat release-notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
